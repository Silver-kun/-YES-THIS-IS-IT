diploiVersion: "v1.0"
components:
  - name: "AI Studio API"
    identifier: "api"
    # This package tells Diploi the base type, but folder: "." overrides it 
    # so Diploi builds your custom Dockerfiles instead of theirs.
    package: "https://github.com/diploi/component-nodejs#main"
    folder: "."
    hosts:
      # This is what was missing! It tells Diploi to create a public URL 
      # and route web traffic to port 3000 inside your Docker container.
      - identifier: "web"
        name: "Web Interface"
        port: 3000
    env:
      include:
        - name: PORT
          value: "3000"
