diploiVersion: "v1.0"
components:
  - name: "AI Studio API"
    identifier: "api"
    # Even if we use the Node package URL here as a base template, 
    # Diploi's engine is hardcoded to prioritize YOUR local Dockerfiles over theirs.
    package: "https://github.com/diploi/component-nodejs#main"
    folder: "."
    env:
      include:
        - name: PORT
          value: "3000"
          